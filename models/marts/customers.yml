models:
  - name: customers
    description: "Customer overview data mart, offering key details for each unique customer. One row per customer. Customer grain mart.\n"
    config:
      group: analytics
      access: public
      contract:
        enforced: true
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "lifetime_spend_pretax + lifetime_tax_paid = lifetime_spend"
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
        entity:
          type: primary
          name: customer
      - name: customer_name
        description: Customers' full name.
        data_type: varchar
        dimension:
          type: categorical
      - name: count_lifetime_orders
        description: Total number of orders a customer has ever placed.
        data_type: number
      - name: first_ordered_at
        description: The timestamp when a customer placed their first order.
        data_type: timestamp_ntz
        dimension:
          type: time
        granularity: day
      - name: last_ordered_at
        description: The timestamp of a customer's most recent order.
        data_type: timestamp_ntz
        dimension:
          type: time
        granularity: day
      - name: lifetime_spend_pretax
        description: The sum of all the pre-tax subtotals of every order a customer has placed.
        data_type: number
      - name: lifetime_tax_paid
        description: The sum of all the tax portion of every order a customer has placed.
        data_type: number
      - name: lifetime_spend
        description: "{{ doc('lifetime_spend') }}"
        data_type: number
      - name: customer_type
        description: "{{ doc('customer_type') }}"
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ["new", "returning"]
        dimension:
          type: categorical
    semantic_model:
      enabled: true
    agg_time_dimension: first_ordered_at
    metrics:
      - name: lifetime_spend_pretax
        description: Customer's lifetime spend before tax
        label: LTV Pre-tax
        type: simple
        agg: sum
      - name: count_lifetime_orders
        description: Count of lifetime orders
        label: Count Lifetime Orders
        type: simple
        agg: sum
      - name: new_customers
        description: Count of customers who have placed exactly one order (first-time buyers).
        label: New Customers
        type: simple
        expr: customer_id
        filter: |
          {{ Dimension('customer__customer_type') }} = 'new'
        agg: count_distinct
      - name: returning_customers
        description: Count of customers who have placed more than one order.
        label: Returning Customers
        type: simple
        expr: customer_id
        filter: |
          {{ Dimension('customer__customer_type') }} = 'returning'
        agg: count_distinct
      - name: lifetime_spend
        agg: sum
        description: Gross customer lifetime spend inclusive of taxes.
        type: simple
        hidden: true
      - name: average_order_value
        description: LTV pre-tax / number of orders
        label: Average Order Value
        type: derived
        expr: lifetime_spend_pretax / count_lifetime_orders
        input_metrics:
          - name: count_lifetime_orders
          - name: lifetime_spend_pretax
      - name: customer_retention_rate
        description: Returning customers as a percentage of all customers with at least one order.
        label: Customer Retention Rate
        type: derived
        expr: returning_customers / (new_customers + returning_customers)
        input_metrics:
          - name: returning_customers
          - name: new_customers

saved_queries:
  - name: customer_order_metrics
    query_params:
      metrics:
        - count_lifetime_orders
        - lifetime_spend_pretax
        - average_order_value
        - new_customers
        - returning_customers
        - customer_retention_rate
      group_by:
        - Entity('customer')
    exports:
      - name: customer_order_metrics
        config:
          export_as: table
