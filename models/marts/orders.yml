models:
  - name: orders
    description: "Order overview data mart, offering key details for each order inlcluding if it's a customer's first order and a food vs. drink item breakdown. One row per order. Order fact table. This table is at the order grain with one row per order.\n"
    config:
      group: finance
      access: public
      contract:
        enforced: true
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_items_subtotal = subtotal"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_total = subtotal + tax_paid"
    columns:
      - name: order_id
        description: "{{ doc('order_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
        entity:
          type: primary
      - name: location_id
        description: "{{ doc('location_id') }}"
        data_type: varchar
        entity:
          type: foreign
          name: location
      - name: customer_id
        description: The foreign key relating to the customer who placed the order.
        data_type: varchar
        entity:
          type: foreign
          name: customer
      - name: subtotal_cents
        description: Pre-tax order subtotal in cents.
        data_type: number
      - name: tax_paid_cents
        description: Tax paid in cents.
        data_type: number
      - name: order_total_cents
        description: Total order amount in cents.
        data_type: number
      - name: subtotal
        description: Pre-tax order subtotal in dollars.
        data_type: number
      - name: tax_paid
        description: Tax paid in dollars.
        data_type: number
      - name: order_total
        description: "{{ doc('order_total') }}"
        data_type: number
        dimension:
          type: categorical
          name: order_total_dim
      - name: ordered_at
        description: "{{ doc('ordered_at') }}"
        data_type: timestamp_ntz
        dimension:
          type: time
        granularity: day
      - name: order_cost
        description: The sum of supply expenses to fulfill the order.
        data_type: number
      - name: order_items_subtotal
        description: Sum of product prices for all items in the order.
        data_type: number
      - name: count_food_items
        description: Number of food items in the order.
        data_type: number
      - name: count_drink_items
        description: Number of drink items in the order.
        data_type: number
      - name: count_order_items
        description: Total number of items in the order.
        data_type: number
      - name: is_food_order
        description: A boolean indicating if this order included any food items.
        data_type: boolean
        dimension:
          type: categorical
      - name: is_drink_order
        description: A boolean indicating if this order included any drink items.
        data_type: boolean
        dimension:
          type: categorical
      - name: customer_order_number
        description: The sequential order number for this customer (1 = first order).
        data_type: number

        dimension:
          type: categorical
    semantic_model:
      enabled: true
    agg_time_dimension: ordered_at
    metrics:
      - name: order_cost
        description: Sum of cost for each order item.
        label: Order Cost
        type: simple
        agg: sum
      - name: order_total
        description: Sum of total order amonunt. Includes tax + revenue.
        type: simple
        label: Order Total
        agg: sum
      - name: new_customer_orders
        description: New customer's first order count
        label: First-Time Orders
        type: simple
        filter: |
          {{ Dimension('order_id__customer_order_number') }} = 1
        agg: sum
        expr: 1
      - name: large_orders
        description: "Count of orders with order total over 20."
        type: simple
        label: Large Orders
        filter: |
          {{ Dimension('order_id__order_total_dim') }} >= 20
        agg: sum
        expr: 1
      - name: orders
        description: Count of orders.
        label: Orders
        type: simple
        agg: sum
        expr: 1
      - name: food_orders
        description: Count of orders that contain food order items
        label: Food Orders
        type: simple
        filter: |
          {{ Dimension('order_id__is_food_order') }} = true
        agg: sum
        expr: 1
      - name: drink_orders
        description: Count of orders that contain drink order items
        label: Drink Orders
        type: simple
        filter: |
          {{ Dimension('order_id__is_drink_order') }} = true

        agg: sum
        expr: 1
      - name: tax_paid
        description: The total tax paid on each order.
        agg: sum
        type: simple
        hidden: true
unit_tests:
  - name: test_order_items_compute_to_bools_correctly
    description: "Test that the counts of drinks and food orders convert to booleans properly."
    model: orders
    given:
      - input: ref('order_items')
        rows:
          - {order_id: 1, order_item_id: 1, is_drink_item: false, is_food_item: true}
          - {order_id: 1, order_item_id: 2, is_drink_item: true, is_food_item: false}
          - {order_id: 2, order_item_id: 3, is_drink_item: false, is_food_item: true}
      - input: ref('stg_orders')
        rows:
          - {order_id: 1}
          - {order_id: 2}
    expect:
      rows:
        - {order_id: 1, count_food_items: 1, count_drink_items: 1, is_drink_order: true, is_food_order: true}
        - {order_id: 2, count_food_items: 1, count_drink_items: 0, is_drink_order: false, is_food_order: true}
saved_queries:
  - name: order_metrics
    query_params:
      metrics:
        - orders
        - new_customer_orders
        - order_total
        - food_orders
        - drink_orders
      group_by:
        - TimeDimension('metric_time', 'day')
    exports:
      - name: order_metrics
        config:
          export_as: table